name: Build APK and Send to Telegram

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8632489493:AAGVkQCVRq4D9mU2NpxrPP-MMx0LOebaMpc' }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6130389200' }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "Uploading APK ($APK_PATH) to Telegram chat $CHAT_ID..."
            curl -s -v -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="🎬 YouTube Dublyaj & Subtitr APK muvaffaqiyatli yig'ildi!%0A✅ Android qurilmangizga o'rnatib ishlatishingiz mumkin." \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            echo "APK sent to Telegram successfully!"
          else
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
